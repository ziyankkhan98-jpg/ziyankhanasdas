const turf = [];
const GRASS = windSway(new THREE.MeshStandardMaterial({
  map: grassTex, alphaTest: 0.5, side: THREE.DoubleSide,
  roughness: 0.92, metalness: 0, color: 0xa8bd86,
}), 0.09, 2.0);
function bank(x, y, z, sx, sy, sz, seed) {
  const geo = new THREE.SphereGeometry(1, 36, 24);
  const pos = geo.attributes.position;
  for (let i = 0; i &lt; pos.count; i++) {
    const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    const n = 1 + (fbm(vx * 2.2 + seed, vz * 2.2 + seed, 3) - .5) * .34;
    pos.setXYZ(i, vx * n, vy * n, vz * n);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, DN.moss);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz);
  m.castShadow = true; m.receiveShadow = true;

  /* Turf. A smooth mound with a moss map on it is a painted hill from three
     metres away; what sells grass at this range is silhouette — thousands of
     little cut-outs standing off the surface, breaking the line where the
     mound meets the sky and catching the low sun on their edges. The tufts sit
     on the *deformed* radius, sampled with the same noise the mound was built
     from, so none of them float. */
  const rnd = rand32(Math.floor(seed * 613) + 7);
  const P = new THREE.Vector3(), N = new THREE.Vector3(), Q = new THREE.Quaternion();
  const UP = new THREE.Vector3(0, 1, 0), S = new THREE.Vector3(), E = new THREE.Euler();
  const count = Math.round(620 * (sx * sz) / 14);
  for (let i = 0; i &lt; count; i++) {
    // cosine-ish sampling over the upper cap, densest where we actually see it
    const u = rnd() * 6.283, v = 0.12 + Math.pow(rnd(), 0.62) * 0.88;
    const sinP = Math.sqrt(1 - v * v);
    const ux = Math.cos(u) * sinP, uy = v, uz = Math.sin(u) * sinP;
    const nz = 1 + (fbm(ux * 2.2 + seed, uz * 2.2 + seed, 3) - .5) * .34;
    P.set(x + ux * nz * sx, y + uy * nz * sy, z + uz * nz * sz);
    if (P.y &lt; 0.05) continue;
    N.set(ux / sx, uy / sy, uz / sz).normalize().lerp(UP, 0.55).normalize();
    P.addScaledVector(N, -0.04);                      // bury the base
    Q.setFromUnitVectors(UP, N);
    E.set(0, rnd() * 6.283, 0);
    Q.multiply(new THREE.Quaternion().setFromEuler(E));
    const sz2 = 0.17 + rnd() * 0.19;
    const dry = rnd() &lt; .13, k = .74 + rnd() * .5;
    turf.push({
      m: new THREE.Matrix4().compose(P, Q, S.set(sz2 * (.8 + rnd() * .5), sz2, sz2)),
      c: new THREE.Color(dry ? 1.06 * k : k, dry ? .94 * k : k * 1.04, dry ? .62 * k : k * .88),
    });
  }
  return m;
}

const shideTex = canvasTex(128, 384, (g, w, h) =&gt; {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#f6f2e6';
  // folded paper zigzag
  let y = 6;
  const step = h / 5;
  for (let i = 0; i &lt; 5; i++) {
    const left = i % 2 ? w * 0.06 : w * 0.30;
    g.fillRect(left, y, w * 0.64, step * 0.78);
    y += step;
  }
});
{
  const rope = new THREE.Group();
  const L = 10.6, sag = 0.62, segs = 20;
  const ropeMat = new THREE.MeshStandardMaterial({ color: 0xcfc3a0, roughness: 0.96, metalness: 0 });
  for (let i = 0; i &lt; segs; i++) {
    const t0 = -1 + 2 * i / segs, t1 = -1 + 2 * (i + 1) / segs;
    const x0 = t0 * L / 2, x1 = t1 * L / 2;
    const y0 = -sag * (1 - t0 * t0), y1 = -sag * (1 - t1 * t1);
    const len = Math.hypot(x1 - x0, y1 - y0);
    const tm = (t0 + t1) / 2;

/* ---- sakura petals: GPU-animated points, fall + sway + flutter ---- */
const petals = (() =&gt; {
  const N = 1400, FALL = 30;   // FALL: cycle height, tall enough to enter from off-screen
  const pos = new Float32Array(N * 3), att = new Float32Array(N * 3);
  for (let i = 0; i &lt; N; i++) {
    pos[i * 3] = (hash2(i, 1) - 0.5) * 46;
    pos[i * 3 + 1] = hash2(i, 2) * FALL;
    pos[i * 3 + 2] = -48 + hash2(i, 3) * 64;
    att[i * 3] = hash2(i, 4) * 6.28;             // phase
    att[i * 3 + 1] = 0.5 + hash2(i, 5) * 1.15;   // fall speed
    att[i * 3 + 2] = 0.6 + hash2(i, 6) * 0.78;   // size
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aAtt', new THREE.BufferAttribute(att, 3));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: { value: 0 }, uOpacity: { value: 1 }, uPix: { value: 1 }, uFall: { value: FALL }, tMap: { value: petalTex } },
    vertexShader: /* glsl */`
      attribute vec3 aAtt; uniform float uTime, uPix, uFall; varying float vRot, vA;
      void main(){
        vec3 p = position;
        p.y = mod(position.y - uTime * aAtt.y, uFall);
        p.x += sin(uTime * 0.9 * aAtt.y + aAtt.x) * 1.1 + sin(uTime * 0.23 + aAtt.x) * 0.8;
        p.z += cos(uTime * 0.7 * aAtt.y + aAtt.x) * 0.6;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = min(aAtt.z * (78.0 / max(-mv.z, 1.0)), 11.0) * uPix;   // capped: near petals are pure overdraw   // capped: huge near points are pure overdraw
        vRot = uTime * 2.2 * aAtt.y + aAtt.x;
        // flutter: petal flips edge-on now and then
        vA = 0.55 + 0.45 * abs(sin(uTime * 1.7 * aAtt.y + aAtt.x));
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tMap; uniform float uOpacity; varying float vRot, vA;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float c = cos(vRot), s = sin(vRot);
        vec2 r = vec2(c*d.x - s*d.y, s*d.x + c*d.y) + 0.5;
        vec4 t = texture2D(tMap, r);
        float a = t.a * vA * uOpacity;
        if (a &lt; 0.02) discard;
        gl_FragColor = vec4(t.rgb, a);
      }`,
  }));
  m.frustumCulled = false;
  m.renderOrder = 3;
  zGate.add(m);
  gateWater.exclude.push(m);
  return m;
})();

/* ---- day → dusk → night driver ----------------------------------------
   `night` runs 0..1 across the hero's scroll. Everything below is a plain
   interpolation of a day pose and a night pose (with a warm dusk waypoint in
   the middle for sky, fog and key light), so the change is one continuous
   cinematic grade rather than a cut. */
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color();
const lerp = (a, b, t) =&gt; a + (b - a) * t;
const sm = (a, b, t) =&gt; { const k = Math.min(1, Math.max(0, (t - a) / (b - a))); return k * k * (3 - 2 * k); };
/** three-stop colour ramp: day → dusk → night */
function ramp3(out, day, dusk, night, t) {
  if (t &lt; 0.5) return out.setHex(day).lerp(_c3.setHex(dusk), sm(0, 0.5, t));
  return out.setHex(dusk).lerp(_c3.setHex(night), sm(0.5, 1, t));
}
let dayNight = -1;
function applyDayNight(n, t) {
  dayNight = n;
  const late = sm(0.55, 0.92, n);          // deep night settles

  skyMat.uniforms.uNight.value = n;
  skyMat.uniforms.uTime.value = t;

  // atmosphere (overrides the zone preset while the hero is active)
  ramp3(scene.fog.color, 0xc9dde6, 0x2a1416, 0x0d1518, n);
  scene.fog.density = lerp(0.0024, 0.0092, sm(0.3, 0.95, n));
  ramp3(scene.background, 0xa8cce0, 0x140a0c, 0x070b0d, n);

  // sky light → moonlight
  gateKey.color.copy(ramp3(_c1, 0xfff2dc, 0x9a6a5c, 0xbcd2ec, n));
  gateKey.intensity = lerp(2.45, 1.45, sm(0.10, 0.70, n));
  gateKey.position.set(lerp(17, 0, late), lerp(14, 34, late), lerp(7, -120, late));
  gateAmbient.color.copy(ramp3(_c1, 0x8a9aa4, 0x241618, 0x172230, n));
  gateAmbient.intensity = lerp(1.02, 0.62, sm(0.10, 0.70, n));
  gateHemi.color.copy(ramp3(_c1, 0xe0eef6, 0x6a4a44, 0x54708c, n));
  gateHemi.groundColor.copy(ramp3(_c2, 0x5a6a4a, 0x1e0c0a, 0x2a0f0a, n));
  gateHemi.intensity = lerp(2.15, 0.85, sm(0.10, 0.70, n));
  gateRim.color.copy(ramp3(_c1, 0xbfd6e4, 0x7a5448, 0x6f92b4, n)); gateRim.intensity = lerp(0.7, 0.55, late);
  gateRim2.color.copy(ramp3(_c1, 0x8fb0c4, 0x5c4038, 0x466a80, n)); gateRim2.intensity = lerp(0.5, 0.4, late);

  // The lantern hangs there from the very first frame — flat red paper taking
  // sky light by day, a candle behind it once the light goes.
  const lit = sm(0.14, 0.82, n);
  const flick = 0.95 + 0.05 * (Math.sin(t * 1.9) * 0.6 + Math.sin(t * 0.73 + 1.1) * 0.4);
  lanternPaper.emissiveIntensity = lerp(0.05, 2.45, lit) * flick;
  lanternPaper.color.setScalar(lerp(1.0, 0.66, lit));      // paper stops answering to the sky
  lanternHalo.material.opacity = sm(0.20, 0.78, n) * (0.5 + Math.sin(t * 0.6) * 0.06) * flick;
  gateSunLight.intensity = 320 * sm(0.18, 0.82, n) * flick;
  gateFill.intensity = 105 * sm(0.18, 0.82, n) * flick;
  shrineLamp.intensity = 330 * sm(0.42, 0.85, n);

  // moon: last thing to show
  const moonIn = sm(0.74, 0.96, n);
  moonDisc.material.opacity = moonIn;
  moonHalo.material.opacity = moonIn * (0.66 + Math.sin(t * 0.28) * 0.05);

  // surfaces
  for (const L of landLayers) L.mesh.material.color.copy(ramp3(_c1, L.day, L.dusk, L.night, n));
  DN.moss.color.copy(ramp3(_c1, 0xa9c27c, 0x46502f, 0x7f9060, n));
  GRASS.color.copy(ramp3(_c2, 0xb6cc8c, 0x4c5433, 0x76885c, n));
  gateWater.material.uniforms.uColor.value.copy(ramp3(_c1, 0x35484f, 0x120c0e, 0x0a1013, n));

  // foliage: the blossom's cut-off climbs until nothing survives it while the
  // maple's falls — a dissolve rather than a dip, so neither canopy ever goes
  // soft-edged against the sky
  const turn = sm(0.48, 0.9, n);
  DN.cherry.color.copy(ramp3(_c1, 0xf2b9cb, 0xb07f86, 0x7e4246, n));
  DN.cherry.alphaTest = lerp(0.42, 1.02, turn);
  DN.mapleNight.color.copy(ramp3(_c2, 0xe07a4a, 0xc04a28, 0x8e2f1e, n));
  DN.mapleNight.alphaTest = lerp(1.02, 0.42, turn);
  // a canopy nothing survives is still a draw call and a shadow pass — skip it
  const showCherry = turn &lt; 0.995, showMaple = turn &gt; 0.005;
  for (const c of DN.cherryCards) c.visible = showCherry;
  for (const c of DN.mapleCards) c.visible = showMaple;
  petals.material.uniforms.uOpacity.value = 1 - sm(0.3, 0.72, n);
  petals.material.uniforms.uTime.value = t;
  petals.visible = n &lt; 0.74;

  // lanterns come on through dusk
  const lampOn = sm(0.42, 0.8, n);
  DN.paper.emissiveIntensity = lerp(0.04, 1.35, lampOn);
  for (let i = gateFlickFrom; i &lt; gateFlickTo; i++) flickerers[i].scale = lampOn;

  // weather
  const wet = sm(0.5, 0.92, n);
  gateRain.material.opacity = 0.085 * wet;
  gateRain.visible = wet &gt; 0.01;
  for (const m of gateMist.children) m.userData.scale = lerp(0.16, 1, sm(0.3, 0.9, n));
}

      fragmentShader: /* glsl */`
        varying vec3 vP;

/* =========================================================================
   9 · post — HDR bright pass, bloom pyramid, ACES, grade, grain, vignette
   ========================================================================= */

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
quadScene.add(quad);

const rt = (w, h) =&gt; new THREE.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), {
  type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false,
});
const rtScene = new THREE.WebGLRenderTarget(2, 2, {
  type: THREE.HalfFloatType, samples: 4, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
});
const LEVELS = 4;
const bright = rt(2, 2);
const blurA = [], blurB = [];
for (let i = 0; i &lt; LEVELS; i++) { blurA.push(rt(2, 2)); blurB.push(rt(2, 2)); }

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, uThreshold: { value: 0.66 }, uKnee: { value: 0.38 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uThreshold, uKnee; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.2126,0.7152,0.0722));
      float k = uKnee * uThreshold + 1e-5;
      float s = clamp(l - uThreshold + k, 0.0, 2.0*k);
      s = s*s/(4.0*k);
      gl_FragColor = vec4(c * (max(l - uThreshold, s) / max(l, 1e-5)), 1.0);
    }`,
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * 0.227027;
      c += texture2D(tDiffuse, vUv + uDir*1.3846).rgb * 0.316216;
      c += texture2D(tDiffuse, vUv - uDir*1.3846).rgb * 0.316216;
      c += texture2D(tDiffuse, vUv + uDir*3.2308).rgb * 0.070270;
      c += texture2D(tDiffuse, vUv - uDir*3.2308).rgb * 0.070270;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
const compMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tB0: { value: null }, tB1: { value: null }, tB2: { value: null }, tB3: { value: null },
    uBloom: { value: 0.58 }, uExposure: { value: 1.02 }, uTime: { value: 0 },
    uGrain: { value: 0.03 }, uVignette: { value: 1.02 }, uAberr: { value: 0.0016 },
    uFade: { value: 0 }, uAspect: { value: 1 }, uContrast: { value: 1.06 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene, tB0, tB1, tB2, tB3;
    uniform float uBloom, uExposure, uTime, uGrain, uVignette, uAberr, uFade, uAspect, uContrast;
    varying vec2 vUv;
    vec3 aces(vec3 x){
      const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
      return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
    }
    float rnd(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv = vUv, d = uv - 0.5;
      float r2 = dot(d,d);
      vec3 col;
      col.r = texture2D(tScene, uv + d * uAberr * (1.0 + r2*2.0)).r;
      col.g = texture2D(tScene, uv).g;
      col.b = texture2D(tScene, uv - d * uAberr * (1.0 + r2*2.0)).b;
      vec3 bl = texture2D(tB0, uv).rgb * 1.00 + texture2D(tB1, uv).rgb * 0.80
              + texture2D(tB2, uv).rgb * 0.58 + texture2D(tB3, uv).rgb * 0.42;
      col += bl * uBloom;
      col = aces(col * uExposure);
      vec3 shadowTint = vec3(0.87, 1.02, 1.05);
      vec3 highTint   = vec3(1.04, 0.99, 0.95);
      float l = dot(col, vec3(0.2126,0.7152,0.0722));
      col *= mix(shadowTint, highTint, smoothstep(0.05, 0.7, l));
      col = mix(vec3(l), col, 1.07);
      col = clamp(col, 0.0, 1.0);
      vec2 vd = d * vec2(uAspect, 1.0);
      float vig = smoothstep(0.98, 0.24, length(vd) * uVignette);
      col *= mix(0.30, 1.0, vig);
      float g = rnd(uv * vec2(1024.0) + fract(uTime) * 91.7) - 0.5;
      col += g * uGrain * (0.35 + 0.65 * (1.0 - l));
      col *= (1.0 - uFade);        // transitions fall through black, never through light
      vec3 enc = pow(max(col, 0.0), vec3(1.0/2.2));
      /* The contrast curve is applied after the encode rather than before it.
         Run in linear, the same curve spends almost all of its slope on the
         top stop and simply crushes everything below it — and by the end of
         the hero this frame is nearly all shadow. Pivoted low, at 0.32, it
         deepens the night without taking the lit paper down with it. */
      enc = clamp((enc - 0.32) * uContrast + 0.32, 0.0, 1.0);
      gl_FragColor = vec4(enc, 1.0);
    }`,
});

function renderPass(mat, target) {
  quad.material = mat;
  renderer.setRenderTarget(target);
  renderer.clear();
  renderer.render(quadScene, quadCam);
}
function resizePost(w, h) {
  const p = renderer.getPixelRatio();
  const W = (w * p) | 0, H = (h * p) | 0;
  rtScene.setSize(W, H);
  bright.setSize(W &gt;&gt; 1, H &gt;&gt; 1);
  for (let i = 0; i &lt; LEVELS; i++) {
    const s = 1 &lt;&lt; (i + 1);
    blurA[i].setSize(Math.max(2, W / s | 0), Math.max(2, H / s | 0));
    blurB[i].setSize(Math.max(2, W / s | 0), Math.max(2, H / s | 0));
  }
  gateWater.setSize(W, H);
  endWater.setSize(W, H);
  // gl_PointSize is in device pixels — keep lanterns the same apparent size on HiDPI
  const px = renderer.getPixelRatio();
  petals.material.uniforms.uPix.value = px;
  compMat.uniforms.uAspect.value = w / h;
}

    fog: { color: 0x1a1410, density: 0.0155 }, bg: 0x120d0a, exposure: 1.06,
    keys: [
      { p: V(0, 1.75, 6), t: V(0, 2.30, -14), fov: 46 },
      { p: V(0.9, 2.60, -46), t: V(1.4, 3.40, -68), fov: 44 },
      { p: V(-0.4, 5.10, -112), t: V(-0.2, 6.10, -140), fov: 44 },
      { p: V(0.2, 7.60, -152), t: V(0.2, 8.40, -176), fov: 46 },
    ],
  },
  {
    id: 'garden', group: zGarden, origin: ORIGIN.garden, range: [0.47, 0.66], lift: 1,
    fog: { color: 0x9aa79f, density: 0.0088 }, bg: 0x8e9b94, exposure: 1.0,
    keys: [
      { p: V(-16, 3.6, 17), t: V(-6, 1.2, -4), fov: 44 },
      { p: V(-2, 3.1, 15), t: V(2, 1.0, -6), fov: 42 },
      { p: V(13, 2.7, 13), t: V(6, 0.9, -8), fov: 42 },
    ],
  },
  {
    id: 'hall', group: zHall, origin: ORIGIN.hall, range: [0.66, 0.86], lift: 0,
    fog: { color: 0x1e1811, density: 0.0165 }, bg: 0x140f0a, exposure: 1.05,
    keys: [
      { p: V(0, 2.4, 4), t: V(0, 3.0, -18), fov: 46 },
      { p: V(-1.4, 2.1, -14), t: V(0.8, 3.2, -34), fov: 44 },
      { p: V(0, 2.6, -29), t: V(0, 3.3, -37), fov: 42 },
    ],
  },
  {
    id: 'end', group: zEnd, origin: ORIGIN.end, range: [0.86, 1.00], lift: 0,
    fog: { color: 0x05080d, density: 0.0052 }, bg: 0x000000, exposure: 1.06,
    keys: [
      // one slow, level drift toward the gate — the composition barely moves,
      // which is the point of a still point
      { p: V(0, 4.6, 18), t: V(0, 4.0, -200), fov: 44 },
      { p: V(0, 4.2, -22), t: V(0, 3.6, -200), fov: 43 },
      { p: V(0, 3.8, -62), t: V(0, 3.4, -200), fov: 42 },
    ],
  },
];

const panels = [...document.querySelectorAll('.panel')];
const navLinks = [...document.querySelectorAll('.navlinks a')];
const railSteps = [...document.querySelectorAll('.rail .step')];

let scrollN = 0, scrollTarget = 0, activeZone = -1;
function readScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollTarget = max &gt; 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}
addEventListener('scroll', readScroll, { passive: true });

const mouse = new THREE.Vector2(), mouseS = new THREE.Vector2();
addEventListener('pointermove', e =&gt; {
  mouse.set(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
}, { passive: true });

const ease = t =&gt; t &lt; 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const seg = (n, a, b) =&gt; Math.min(1, Math.max(0, (n - a) / (b - a)));

const DESIGN_ASPECT = 16 / 9, MAX_FOV = 82;
function fitFov(baseFov, aspect) {
  if (aspect &gt;= DESIGN_ASPECT) return baseFov;
  const tanH = Math.tan(THREE.MathUtils.degToRad(baseFov) / 2) * DESIGN_ASPECT;
  return Math.min(MAX_FOV, THREE.MathUtils.radToDeg(2 * Math.atan(tanH / aspect)));
}
function fitWord() {
  if (!wordGroup.userData.halfWidth) return;
  const hero = ZONES[0].keys[0];
  const dist = Math.abs(hero.p.z - wordGroup.position.z);
  const fov = fitFov(hero.fov, camera.aspect);
  const halfW = Math.tan(THREE.MathUtils.degToRad(fov) / 2) * dist * camera.aspect;
  wordGroup.scale.setScalar(Math.min(1, (halfW * 0.80) / wordGroup.userData.halfWidth));
}
let bankBaseY = 0;
const fitBanks = () =&gt; { bankBaseY = camera.aspect &lt; 1.3 ? -(1.3 - camera.aspect) * 0.95 : 0; };

function zoneIndexAt(n) {
  for (let i = 0; i &lt; ZONES.length; i++) if (n &lt; ZONES[i].range[1] || i === ZONES.length - 1) return i;
  return 0;
}

function setZone(i) {
  if (i === activeZone) return;
  activeZone = i;
  ZONES.forEach((z, k) =&gt; { z.group.visible = k === i; });
  const z = ZONES[i];
  scene.fog.color.setHex(z.fog.color);
  scene.fog.density = z.fog.density;
  scene.background.setHex(z.bg);
  compMat.uniforms.uExposure.value = z.exposure;
  railSteps.forEach((s, k) =&gt; s.classList.toggle('on', k === i));
  navLinks.forEach((a, k) =&gt; a.classList.toggle('on', k === i));
}

const _p = new THREE.Vector3(), _t = new THREE.Vector3();
function applyCamera(n) {
  const zi = zoneIndexAt(n);
  const z = ZONES[zi];
  const local = seg(n, z.range[0], z.range[1]);
  const keys = z.keys;
  const f = local * (keys.length - 1);
  const i = Math.min(keys.length - 2, Math.floor(f));
  const k = ease(f - i);
  _p.lerpVectors(keys[i].p, keys[i + 1].p, k).add(z.origin);
  _t.lerpVectors(keys[i].t, keys[i + 1].t, k).add(z.origin);
  let fov = fitFov(keys[i].fov + (keys[i + 1].fov - keys[i].fov) * k, camera.aspect);

  // Portrait widens the fov a lot. Open zones want the camera tilted up (it
  // trades dead foreground for sky); enclosed ones must NOT tilt, or the lit
  // ceiling swings into frame as a blown-out slab.
  if (camera.aspect &lt; 1.3 &amp;&amp; z.lift) {
    const lift = (1.3 - camera.aspect) * 2.2 * z.lift;
    _t.y += lift; _p.y += lift * 0.35;
  }

  const par = 1 - Math.min(1, local * 2.0);
  _p.x += mouseS.x * 1.5 * par + Math.sin(TIME * 0.21) * 0.13;
  _p.y += -mouseS.y * 0.75 * par + Math.sin(TIME * 0.17 + 1.3) * 0.09;
  _t.x += mouseS.x * 0.75 * par;
  _t.y += -mouseS.y * 0.4 * par;

  camera.position.copy(_p);
  camera.lookAt(_t);
  camera.rotation.z += Math.sin(TIME * 0.13) * 0.004;
  if (Math.abs(camera.fov - fov) &gt; 0.001) { camera.fov = fov; camera.updateProjectionMatrix(); }
  return zi;
}

/** A slow dip to black over each cut — wide enough to read as a dissolve
 *  rather than a blink, and it never brightens the frame. */
function transitionFade(n) {
  let best = 0;
  for (let i = 0; i &lt; ZONES.length - 1; i++) {
    const b = ZONES[i].range[1];
    best = Math.max(best, Math.exp(-Math.pow((n - b) / 0.030, 2)));
  }
  return best;
}

function applyUI(n, zi) {
  const z = ZONES[zi];
  const local = seg(n, z.range[0], z.range[1]);
  // each panel fades in early in its zone and out before the hand-off.
  // The first zone starts already visible — it is the landing state.
  // The finale holds its title back so the lantern reveal reads first.
  const last = ZONES.length - 1;
  const fadeIn = zi === 0 ? 1 : seg(local, zi === last ? 0.34 : 0.05, zi === last ? 0.58 : 0.18);
  // every zone hands off by fading out — except the last, which holds
  const vis = fadeIn * (zi === last ? 1 : 1 - seg(local, 0.72, 0.94));
  panels.forEach((p, i) =&gt; {
    const o = i === zi ? vis : 0;
    p.style.opacity = o;
    // one class toggle, at the two ends of the fade — the copy plays in as the
    // zone arrives and re-arms once the panel is fully out again
    if (o &gt; 0.06) { if (!p.classList.contains('live')) p.classList.add('live'); }
    else if (o &lt; 0.01 &amp;&amp; p.classList.contains('live')) p.classList.remove('live');
    // drifts up as its zone plays out; sits flush at rest, so the bottom row
    // is never pushed under the fold on the landing frame
    p.style.transform = o ? `translateY(${-local * 30}px)` : 'translateY(0)';
  });

  if (zi === 0) {
    // FUN HUB and the banks stay put while the light changes, then sink away
    // right at the end to clear the way into the path
    const k = seg(local, 0.70, 0.92);
    wordGroup.position.y = 2.80 - k * 3.2;
    wordGroup.position.z = -2.2 + k * 5.0;
    wordGroup.visible = k &lt; 0.995;
    const o = 1 - seg(local, 0.74, 0.92);
    wordLayers.forEach(m =&gt; { m.material.opacity = o; });
    bankGroup.position.y = bankBaseY - seg(local, 0.70, 0.94) * 8.5;
    bankGroup.visible = bankGroup.position.y &gt; bankBaseY - 8.4;
  }

  compMat.uniforms.uFade.value = transitionFade(n);
}

/* =========================================================================
   11 · loop
   ========================================================================= */

const clock = new THREE.Clock();
let TIME = 0;
const _camPos = new THREE.Vector3();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  resizePost(w, h);
  fitWord();
  fitBanks();
  readScroll();
}
addEventListener('resize', resize);

function frame(dt, snap) {
  TIME += dt;
  const t = TIME;
  WIND.value = t;

  if (snap) { scrollN = scrollTarget; mouseS.copy(mouse); }
  else {
    scrollN += (scrollTarget - scrollN) * Math.min(1, dt * 4.2);
    mouseS.lerp(mouse, Math.min(1, dt * 3.0));
  }

  setZone(zoneIndexAt(scrollN));
  const zi = applyCamera(scrollN);
  applyUI(scrollN, zi);

  for (const m of mistSheets) {
    if (!m.parent || !m.parent.visible) continue;
    m.position.x += m.userData.spd * dt * 0.9;
    if (m.position.x &gt; m.userData.span / 2) m.position.x = -m.userData.span / 2;
    m.position.y += Math.sin(t * 0.3 + m.userData.phase) * dt * 0.09;
    m.material.opacity = m.userData.base * m.userData.scale;
    m.quaternion.copy(camera.quaternion);
  }
  for (const b of billboards) b.quaternion.copy(camera.quaternion);
  for (const f of flickerers) {
    const v = 0.86 + 0.14 * (Math.sin(t * 6.7 + f.seed) * .5 + Math.sin(t * 2.9 + f.seed * 1.7) * .5);
    const on = f.scale === undefined ? 1 : f.scale;
    f.light.intensity = f.base * v * on;
    f.glow.material.opacity = f.gbase * v * on;
    if (f.swing) f.swing.rotation.z = Math.sin(t * 0.8 + f.seed) * 0.05;
  }
  for (const r of rains) {
    if (!r.parent || !r.parent.visible) continue;
    const p = r.geometry.attributes.position, spd = r.userData.spd;
    for (let i = 0; i &lt; spd.length; i++) {
      const s = spd[i] * dt * 2.2;
      let y0 = p.getY(i * 2) - s, y1 = p.getY(i * 2 + 1) - s;
      if (y0 &lt; -1) { const d = 21 + Math.random(); y0 += d; y1 += d; }
      p.setY(i * 2, y0); p.setY(i * 2 + 1, y1);
    }
    p.needsUpdate = true;
  }
  if (zEnd.visible) {
    for (const c of endHaze) {
      c.position.x += c.userData.spd * dt;
      if (c.position.x &gt; c.userData.span / 2) c.position.x = -c.userData.span / 2;
      c.quaternion.copy(camera.quaternion);
    }
    endSun.lookAt(camera.position.x * 0.03, endSun.getWorldPosition(_camPos).y, camera.position.z);
  }
  if (zGate.visible) {
    moon.lookAt(camera.position.x * 0.06, moon.position.y, camera.position.z);
    // a solid now: it sways on its cord instead of billboarding
    lanternSwing.rotation.z = Math.sin(t * 0.23) * 0.013;
    lanternSwing.rotation.x = Math.sin(t * 0.17 + 0.9) * 0.009;
    const z0 = ZONES[0];
    applyDayNight(sm(0.04, 0.84, seg(scrollN, z0.range[0], z0.range[1])), t);
  }

  camera.getWorldPosition(_camPos);
  for (const w of [gateWater, endWater]) {
    w.material.uniforms.uTime.value = t;
    w.material.uniforms.uCam.value.copy(_camPos);
  }

  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene, camera);

  brightMat.uniforms.tDiffuse.value = rtScene.texture;
  renderPass(brightMat, bright);
  let src = bright;
  for (let i = 0; i &lt; LEVELS; i++) {
    const w = blurA[i].width, h = blurA[i].height;
    blurMat.uniforms.tDiffuse.value = src.texture;
    blurMat.uniforms.uDir.value.set(1 / w, 0);
    renderPass(blurMat, blurA[i]);
    blurMat.uniforms.tDiffuse.value = blurA[i].texture;
    blurMat.uniforms.uDir.value.set(0, 1 / h);
    renderPass(blurMat, blurB[i]);
    src = blurB[i];
  }
  compMat.uniforms.tScene.value = rtScene.texture;
  compMat.uniforms.tB0.value = blurB[0].texture;
  compMat.uniforms.tB1.value = blurB[1].texture;
  compMat.uniforms.tB2.value = blurB[2].texture;
  compMat.uniforms.tB3.value = blurB[3].texture;
  compMat.uniforms.uTime.value = t;
  renderPass(compMat, null);
}

function animate() {
  requestAnimationFrame(animate);
  frame(Math.min(clock.getDelta(), 0.05), false);
}

/* =========================================================================
   12 · boot
   ========================================================================= */

const jumpTo = i =&gt; {
  const max = document.documentElement.scrollHeight - innerHeight;
  const z = ZONES[i];
  scrollTo({ top: max * (z.range[0] + (z.range[1] - z.range[0]) * 0.28), behavior: 'smooth' });
};
navLinks.forEach((a, i) =&gt; a.addEventListener('click', e =&gt; { e.preventDefault(); jumpTo(i); }));
railSteps.forEach((s, i) =&gt; { s.style.cursor = 'pointer'; s.style.pointerEvents = 'auto'; s.addEventListener('click', () =&gt; jumpTo(i)); });

async function boot() {
  try {
    await document.fonts.load('900 200px &quot;Archivo&quot;');
    await document.fonts.load('300 20px &quot;Onest&quot;');
    await document.fonts.ready;
  } catch (e) { /* system stack is fine */ }
  buildWord();
  setZone(0);
  resize();
  animate();
  /* the bar closes its last seven per cent only once a frame has actually been
     drawn, so the fade never uncovers an empty canvas */
  requestAnimationFrame(() =&gt; {
    document.getElementById('loBar').classList.add('done');
    setTimeout(() =&gt; document.getElementById('loading').classList.add('gone'), 260);
  });
  window.__ready = true;
}
boot();

/* Deterministic single-frame stepping — lets the render be verified when the
   host suspends requestAnimationFrame (e.g. a hidden preview pane). */
window.__dbg = {
  THREE, scene, camera, renderer, ZONES, compMat, bankGroup,
  zGate, zPath, zGarden, zHall, zEnd, heroTorii, gateSun, endTorii, moon, endSun, wordGroup, shrineHall, pagoda,
  get n() { return scrollN; },
  get target() { return scrollTarget; },
  get zone() { return activeZone; },
  step(n, t = 6, mx = 0, my = 0) {
    document.getElementById('loading').style.display = 'none';
    scrollTarget = n; mouse.set(mx, my);
    TIME = t - 0.016;
    frame(0.016, true);
    return { n: scrollN, zone: activeZone, cam: camera.position.toArray().map(v =&gt; +v.toFixed(1)), fade: +compMat.uniforms.uFade.value.toFixed(3) };
  },
  box(obj) {
    const b = new THREE.Box3().setFromObject(obj);
    const pts = [];
    for (let i = 0; i &lt; 8; i++) pts.push(new THREE.Vector3(
      i &amp; 1 ? b.max.x : b.min.x, i &amp; 2 ? b.max.y : b.min.y, i &amp; 4 ? b.max.z : b.min.z).project(camera));
    const xs = pts.map(p =&gt; (p.x * .5 + .5) * 100), ys = pts.map(p =&gt; (1 - (p.y * .5 + .5)) * 100);
    const r = v =&gt; +v.toFixed(1);
    return { x0: r(Math.min(...xs)), x1: r(Math.max(...xs)), y0: r(Math.min(...ys)), y1: r(Math.max(...ys)) };
  },
};
&lt;/script&gt;
